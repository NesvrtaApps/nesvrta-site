  <defs>
    <clipPath id="bandB"><rect x="-40" y="0" width="760" height="100"/></clipPath>
    <clipPath id="tailB"><rect x="-40" y="0" width="760" height="150"/></clipPath>
  </defs>
  <g fill="none" stroke="#16130F" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="12">
