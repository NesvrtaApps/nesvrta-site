    <clipPath id="tailC"><rect x="-40" y="0" width="760" height="150"/></clipPath>
  </defs>
  <g fill="none" stroke="#16130F" stroke-width="20" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="12">
